name: classify-sentiment
depends_on: [detect-language]
entrypoint: src/handler.py
handler: run
# Needs outbound HTTPS to huggingface.co to fetch model weights on cold
# start (see src/handler.py). Requires a Snowflake EXTERNAL ACCESS
# INTEGRATION with a NETWORK RULE for huggingface.co, created out-of-band.
external_access_integrations: [huggingface_access_integration]
