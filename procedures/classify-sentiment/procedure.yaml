name: classify-sentiment
depends_on: [detect-language]
entrypoint: src/handler.py
handler: run
# transformers and pytorch are treated as available on Snowflake's
# Anaconda channel (Snowpark ML support ships both there for exactly this
# kind of in-database inference) -- not independently verified against a
# live account from here. Nothing here is vendored: handler.py fetches the
# model weights itself, at runtime, from the Hugging Face Hub (see
# src/handler.py) rather than bundling them under src/model/ -- ~268MB of
# weights is over GitHub's push limit without Git LFS, which this repo
# deliberately doesn't use.
packages: [snowflake-snowpark-python, transformers, pytorch]
# Pass-through to register_from_file's external_access_integrations -- this
# node needs outbound HTTPS to huggingface.co to fetch model weights on
# cold start. Requires a Snowflake EXTERNAL ACCESS INTEGRATION (with a
# NETWORK RULE for huggingface.co) already created in the account -- a
# one-time prerequisite, same as the OAuth security integration in
# .gitlab-ci.yml; this pipeline doesn't create it.
external_access_integrations: [huggingface_access_integration]
