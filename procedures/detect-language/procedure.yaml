name: detect-language
depends_on: [ingest-tickets]
entrypoint: src/handler.py
handler: run
# six -- langdetect's only dependency -- is treated as available on
# Snowflake's Anaconda channel; langdetect itself is not, so it's vendored
# (see vendor/). A node mixing an Anaconda package with a vendored one for
# the same underlying library is the common case in practice.
packages: [snowflake-snowpark-python, six]
